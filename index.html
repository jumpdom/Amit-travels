                dates: ['Fri Departures', '14 Oct', '21 Oct', '28 Oct'],

        const STATES_LIST = ['All States', 'Karnataka', 'Himachal Pradesh', 'Kerala', 'Uttarakhand', 'Goa', 'Rajasthan', 'International'];

        function App() {
            // Persistent Packages State
            const [packages, setPackages] = React.useState(() => {
                const saved = localStorage.getItem('AMIT_TRAVELS_PACKAGES');
                return saved ? JSON.parse(saved) : INITIAL_PACKAGES;
            });

            React.useEffect(() => {
                localStorage.setItem('AMIT_TRAVELS_PACKAGES', JSON.stringify(packages));
            }, [packages]);

            // App Navigation & Filters State
            const [activeTab, setActiveTab] = React.useState('home'); // home, tickets, packages, admin
            const [categoryFilter, setCategoryFilter] = React.useState('All');
            const [selectedState, setSelectedState] = React.useState('All States');
            const [searchQuery, setSearchQuery] = React.useState('');

            // Modals State
            const [bookingModalPkg, setBookingModalPkg] = React.useState(null);
            const [selectedPkgDetail, setSelectedPkgDetail] = React.useState(null);
            const [isAdminAuthModalOpen, setIsAdminAuthModalOpen] = React.useState(false);
            const [adminPassInput, setAdminPassInput] = React.useState('');
            const [adminError, setAdminError] = React.useState('');
            const [isAdminLoggedIn, setIsAdminLoggedIn] = React.useState(false);

            // Toast Alert state
            const [toast, setToast] = React.useState(null);
            const showToast = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3500);
            };

            // Ticket Search Widget State (Train, Flight, Bus)
            const [ticketType, setTicketType] = React.useState('train'); // train, flight, bus
            const [ticketForm, setTicketForm] = React.useState({
                fromCity: '',
                toCity: '',
                travelers: '1 Passenger',
                travelClass: 'Sleeper / Economy',
                dates: ['', '', '', ''] // Up to 4 dates
            });

            // Admin Package Form State
            const [editingPkg, setEditingPkg] = React.useState(null);
            const [pkgForm, setPkgForm] = React.useState({
                title: '',
                category: 'Tour Packages',
                state: 'Karnataka',
                image: '',
                price: '',
                originalPrice: '',
                duration: '',
                dates: ['', '', ''],
                highlights: '',
                description: ''
            });

            // Booking Form State
            const [bookingCustomer, setBookingCustomer] = React.useState({
                name: '',
                phone: '',
                travelersCount: '2 Adults',
                selectedDate: '',
                customDates: '',
                notes: ''
            });

            const handleDirectTicketWhatsApp = (e) => {
                e.preventDefault();
                if (!ticketForm.fromCity || !ticketForm.toCity) {
                    showToast('Please enter From and To city locations!', 'error');
                    return;
                }

                const validDates = ticketForm.dates.filter(d => d.trim() !== '');
                const datesText = validDates.length > 0 ? validDates.join(', ') : 'Flexible Dates';

                const message = `*NEW ${ticketType.toUpperCase()} TICKET BOOKING ENQUIRY - AMIT TRAVELS*\n` +
                    `--------------------------------------\n` +
                    `*Service:* ${ticketType.toUpperCase()} TICKET\n` +
                    `*From:* ${ticketForm.fromCity}\n` +
                    `*To:* ${ticketForm.toCity}\n` +
                    `*Class/Type:* ${ticketForm.travelClass}\n` +
                    `*Passengers:* ${ticketForm.travelers}\n` +
                    `*Preferred Dates (Selected 3-4 options):* ${datesText}\n` +
                    `--------------------------------------\n` +
                    `Please check seat availability and best fares for me.`;

                const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
                window.open(url, '_blank');
                showToast('Opening WhatsApp with ticket details...', 'success');
            };

            const handlePackageBookingSubmit = (e) => {
                e.preventDefault();
                if (!bookingCustomer.name || !bookingCustomer.phone) {
                    showToast('Please provide your Name and Phone Number!', 'error');
                    return;
                }

                const datesChosen = bookingCustomer.selectedDate || bookingCustomer.customDates || 'Flexible Departure';
                const pkgName = bookingModalPkg ? bookingModalPkg.title : 'Custom Package Enquiry';
                const priceText = bookingModalPkg ? `₹${bookingModalPkg.price}` : 'As per quotation';

                const message = `*NEW TOUR BOOKING - AMIT TRAVELS*\n` +
                    `--------------------------------------\n` +
                    `*Package:* ${pkgName}\n` +
                    `*Category:* ${bookingModalPkg ? bookingModalPkg.category : 'General'}\n` +
                    `*State/Destination:* ${bookingModalPkg ? bookingModalPkg.state : 'Multiple'}\n` +
                    `*Price:* ${priceText}\n` +
                    `--------------------------------------\n` +
                    `*Customer Name:* ${bookingCustomer.name}\n` +
                    `*Phone Number:* ${bookingCustomer.phone}\n` +
                    `*Travelers:* ${bookingCustomer.travelersCount}\n` +
                    `*Selected Departure Date(s):* ${datesChosen}\n` +
                    `*Special Request/Notes:* ${bookingCustomer.notes || 'None'}\n` +
                    `--------------------------------------\n` +
                    `Please confirm availability and share itinerary details.`;

                const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
                window.open(url, '_blank');
                setBookingModalPkg(null);
                showToast('Booking details sent to Amit Travels WhatsApp!', 'success');
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPassInput === ADMIN_PASSWORD) {
                    setIsAdminLoggedIn(true);
                    setIsAdminAuthModalOpen(false);
                    setAdminPassInput('');
                    setAdminError('');
                    setActiveTab('admin');
                    showToast('Admin Logged in successfully!', 'success');
                } else {
                    setAdminError('Invalid Admin Password! Please try again.');
                }
            };

            const handleSavePackage = (e) => {
                e.preventDefault();
                if (!pkgForm.title || !pkgForm.price || !pkgForm.image) {
                    showToast('Please fill required fields (Title, Price, Image URL)', 'error');
                    return;
                }

                const highlightsArr = typeof pkgForm.highlights === 'string' 
                    ? pkgForm.highlights.split(',').map(h => h.trim()).filter(Boolean)
                    : pkgForm.highlights;

                const datesArr = Array.isArray(pkgForm.dates) 
                    ? pkgForm.dates.filter(d => d.trim() !== '')
                    : [pkgForm.dates];

                if (editingPkg) {
                    const updated = packages.map(p => p.id === editingPkg.id ? {
                        ...pkgForm,
                        id: editingPkg.id,
                        price: Number(pkgForm.price),
                        originalPrice: Number(pkgForm.originalPrice || pkgForm.price * 1.3),
                        highlights: highlightsArr,
                        dates: datesArr.length > 0 ? datesArr : ['Flexible Dates']
                    } : p);
                    setPackages(updated);
                    showToast('Package updated successfully!');
                } else {
                    const newPkg = {
                        ...pkgForm,
                        id: 'pkg-' + Date.now(),
                        price: Number(pkgForm.price),
                        originalPrice: Number(pkgForm.originalPrice || pkgForm.price * 1.3),
                        highlights: highlightsArr,
                        dates: datesArr.length > 0 ? datesArr : ['Flexible Dates']
                    };
                    setPackages([newPkg, ...packages]);
                    showToast('New Package added successfully!');
                }

                // Reset Form
                setEditingPkg(null);
                setPkgForm({
                    title: '',
                    category: 'Tour Packages',
                    state: 'Karnataka',
                    image: '',
                    price: '',
                    originalPrice: '',
                    duration: '',
                    dates: ['', '', ''],
                    highlights: '',
                    description: ''
                });
            };

            const handleDeletePackage = (id) => {
                if (window.confirm('Are you sure you want to delete this tour package?')) {
                    setPackages(packages.filter(p => p.id !== id));
                    showToast('Package deleted!', 'error');
                }
            };

            const startEditPackage = (pkg) => {
                setEditingPkg(pkg);
                setPkgForm({
                    title: pkg.title,
                    category: pkg.category,
                    state: pkg.state,
                    image: pkg.image,
                    price: pkg.price,
                    originalPrice: pkg.originalPrice,
                    duration: pkg.duration,
                    dates: pkg.dates || ['', '', ''],
                    highlights: Array.isArray(pkg.highlights) ? pkg.highlights.join(', ') : pkg.highlights,
                    description: pkg.description
                });
            };

            const resetDefaultPackages = () => {
                if (window.confirm('Reset all tour packages to default data?')) {
                    setPackages(INITIAL_PACKAGES);
                    localStorage.removeItem('AMIT_TRAVELS_PACKAGES');
                    showToast('Reset to default packages done!');
                }

            const filteredPackages = packages.filter(pkg => {
                const matchesCategory = categoryFilter === 'All' || pkg.category === categoryFilter;
                const matchesState = selectedState === 'All States' || pkg.state === selectedState;
                const matchesSearch = pkg.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      pkg.state.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      pkg.category.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesState && matchesSearch;
            });

            return (

                            {/* Logo & Title */}
                            <div class="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                                <img 
                                    src={LOGO_URL} 
                                    alt="Amit Travels Logo" 
                                    class="h-11 w-11 rounded-xl object-cover ring-2 ring-blue-500 shadow-md"
                                    onError={(e)=>{ e.target.onerror = null; e.target.src="https://placehold.co/100x100/1e293b/ffffff?text=AT"; }}
                                />
                                <div>
                                    <h1 class="text-xl font-black tracking-wider text-white flex items-center gap-1.5">
                                        AMIT <span class="text-blue-500">TRAVELS</span>
                                    </h1>
                                    <p class="text-xs text-emerald-400 font-medium">Your Trusted Travel Partner</p>
                                </div>
                            </div>

                            {/* Desktop Navigation Links */}
                            <nav class="hidden md:flex items-center gap-6 text-sm font-semibold">
                                <button 
                                    onClick={() => setActiveTab('home')} 
                                    class={`hover:text-blue-400 transition-colors ${activeTab === 'home' ? 'text-blue-500 underline underline-offset-8 decoration-2' : 'text-slate-300'}`}
                                >
                                    Home & Packages
                                </button>
                                <button 
                                    onClick={() => setActiveTab('tickets')} 
                                    class={`hover:text-blue-400 transition-colors ${activeTab === 'tickets' ? 'text-blue-500 underline underline-offset-8 decoration-2' : 'text-slate-300'}`}
                                >
                                    Book Tickets
                                </button>
                                {isAdminLoggedIn ? (
                                    <button 
                                        onClick={() => setActiveTab('admin')} 
                                        class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 shadow"
                                    >

                                    </button>
                                ) : (

                                        onClick={() => setIsAdminAuthModalOpen(true)}

                                    >
                                        <i class="fa-solid fa-lock"></i> Admin Login
                                    </button>
                                )}
                            </nav>

                            {/* Direct WhatsApp Call Button */}
                            <a 
                                href={`https://wa.me/${WHATSAPP_NUMBER}`} 
                                target="_blank" 
                                rel="noreferrer" 
                                class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-xl font-bold text-xs flex items-center gap-2 shadow-lg shadow-emerald-900/30 transition-all transform hover:scale-105"
                            >

                                <span class="hidden sm:inline">WhatsApp Help</span>

                        </div>
                    </header>

                    {/* Toast Alert Popup */}
                    {toast && (

                                <i class={`fa-solid ${toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'} text-lg`}></i>
                                <span>{toast.msg}</span>
                            </div>
                        </div>
                    )}

                    {}
                    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">

                        {/* VIEW 1: HOME & TOUR PACKAGES */}
                        {activeTab === 'home' && (
                            <div>
                                {/* Hero Banner */}
                                <div class="relative rounded-3xl overflow-hidden mb-8 p-6 md:p-10 bg-gradient-to-r from-blue-900 via-slate-900 to-indigo-950 border border-slate-800 shadow-2xl">
                                    <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1200&q=80')] bg-cover bg-center opacity-10"></div>
                                    <div class="relative z-10 max-w-2xl">
                                        <span class="inline-block px-3 py-1 bg-blue-500/20 text-blue-400 border border-blue-500/30 rounded-full text-xs font-semibold mb-3">
                                            ✈️ Premier Travel Booking Hub
                                        </span>
                                        <h2 class="text-3xl md:text-5xl font-extrabold text-white tracking-tight leading-tight mb-3">
                                            Explore The World With <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">Amit Travels</span>
                                        </h2>
                                        <p class="text-slate-300 text-sm md:text-base mb-6">
                                            Book Flights, Train & Bus tickets with flexible dates option. Discover Honeymoon Packages, State Treks, and One-Day trips from Bangalore.
                                        </p>
                                        <div class="flex flex-wrap gap-3">
                                            <button 
                                                onClick={() => setActiveTab('tickets')} 
                                                class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-2.5 rounded-xl text-sm shadow-lg shadow-blue-600/30 transition-all flex items-center gap-2"
                                            >
                                                <i class="fa-solid fa-ticket"></i> Book Train / Flight / Bus
                                            </button>
                                            <a 
                                                href="#packages-section" 
                                                class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold px-5 py-2.5 rounded-xl text-sm transition-all flex items-center gap-2"
                                            >
                                                <i class="fa-solid fa-compass"></i> Explore Packages
                                            </a>
                                        </div>
                                    </div>
                                </div>

                                {}
                                <div class="glass-card rounded-2xl p-4 md:p-6 mb-8 border border-slate-800 shadow-xl">
                                    <div class="flex items-center justify-between mb-4">
                                        <h3 class="text-lg font-bold text-white flex items-center gap-2">
                                            <i class="fa-solid fa-paper-plane text-blue-400"></i> Quick Ticket Booking Enquiries
                                        </h3>
                                        <span class="text-xs text-emerald-400 bg-emerald-950/60 border border-emerald-800 px-2.5 py-1 rounded-full font-medium">
                                            Multi-Date Selection Available
                                        </span>
                                    </div>

                                    {/* Ticket Category Tabs */}
                                    <div class="flex gap-2 border-b border-slate-700/60 pb-3 mb-4">
                                        <button 
                                            onClick={() => setTicketType('train')} 
                                            class={`px-4 py-2 rounded-xl font-bold text-xs transition-all flex items-center gap-2 ${ticketType === 'train' ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-800 text-slate-400 hover:text-slate-200'}`}
                                        >
                                            <i class="fa-solid fa-train"></i> Train Ticket
                                        </button>
                                        <button 
                                            onClick={() => setTicketType('flight')} 
                                            class={`px-4 py-2 rounded-xl font-bold text-xs transition-all flex items-center gap-2 ${ticketType === 'flight' ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-800 text-slate-400 hover:text-slate-200'}`}
                                        >
                                            <i class="fa-solid fa-plane-departure"></i> Flight Ticket
                                        </button>

                                                    <option value="State Trek">State Trek</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            <div>
                                                <label class="text-xs font-semibold text-slate-300 block mb-1">State / Region Name</label>
                                                <select 
                                                    value={pkgForm.state} 
                                                    onChange={(e) => setPkgForm({...pkgForm, state: e.target.value})} 
                                                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                                                >
                                                    <option value="Karnataka">Karnataka</option>
                                                    <option value="Himachal Pradesh">Himachal Pradesh</option>
                                                    <option value="Kerala">Kerala</option>
                                                    <option value="Uttarakhand">Uttarakhand</option>
                                                    <option value="Goa">Goa</option>
                                                    <option value="Rajasthan">Rajasthan</option>
                                                    <option value="Tamil Nadu">Tamil Nadu</option>
                                                    <option value="International">International</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label class="text-xs font-semibold text-slate-300 block mb-1">Price (₹) *</label>
                                                <input 
                                                    type="number" 
                                                    placeholder="4999" 
                                                    value={pkgForm.price} 
                                                    onChange={(e) => setPkgForm({...pkgForm, price: e.target.value})} 
                                                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                                                    required
                                                />
                                            </div>
                                            <div>
                                                <label class="text-xs font-semibold text-slate-300 block mb-1">Original Price (₹) (Discount tag)</label>
                                                <input 
                                                    type="number" 
                                                    placeholder="6999" 
                                                    value={pkgForm.originalPrice} 
                                                    onChange={(e) => setPkgForm({...pkgForm, originalPrice: e.target.value})} 
                                                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                                                />
                                            </div>
                                        </div>

                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label class="text-xs font-semibold text-slate-300 block mb-1">Tour Photo Direct Image URL Link *</label>
                                                <input 
                                                    type="url" 
                                                    placeholder="https://images.unsplash.com/... or postimg link" 
                                                    value={pkgForm.image} 
                                                    onChange={(e) => setPkgForm({...pkgForm, image: e.target.value})} 
                                                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                                                    required
                                                />
                                            </div>
                                            <div>
                                                <label class="text-xs font-semibold text-slate-300 block mb-1">Trip Duration</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="e.g. 3 Days / 2 Nights" 
                                                    value={pkgForm.duration} 
                                                    onChange={(e) => setPkgForm({...pkgForm, duration: e.target.value})} 
                                                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                                                />
                                            </div>
                                        </div>

                                        <div>
                                            <label class="text-xs font-semibold text-slate-300 block mb-1">Key Highlights (Comma separated)</label>
                                            <input 
                                                type="text" 
                                                placeholder="e.g. Free Breakfast, Campfire, Trek Guide, Waterfall visit" 
                                                value={pkgForm.highlights} 
                                                onChange={(e) => setPkgForm({...pkgForm, highlights: e.target.value})} 
                                                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                                            />
                                        </div>

                                        <div>
                                            <label class="text-xs font-semibold text-slate-300 block mb-1">Package Description & Itinerary Details</label>
                                            <textarea 
                                                rows="3" 
                                                placeholder="Detailed description of the tour package..." 
                                                value={pkgForm.description} 
                                                onChange={(e) => setPkgForm({...pkgForm, description: e.target.value})} 
                                                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                                            ></textarea>
                                        </div>

                                        <div class="flex gap-3">
                                            <button 
                                                type="submit" 
                                                class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-2.5 rounded-xl text-xs shadow-md transition-all flex items-center gap-2"
                                            >
                                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                                {editingPkg ? 'Update Package' : 'Publish Package'}
                                            </button>
                                            {editingPkg && (
                                                <button 
                                                    type="button" 
                                                    onClick={() => { setEditingPkg(null); setPkgForm({ title: '', category: 'Tour Packages', state: 'Karnataka', image: '', price: '', originalPrice: '', duration: '', dates: ['', '', ''], highlights: '', description: '' }); }}
                                                    class="bg-slate-800 text-slate-300 hover:bg-slate-700 font-semibold px-4 py-2.5 rounded-xl text-xs"
                                                >
                                                    Cancel Editing
                                                </button>
                                            )}
                                        </div>
                                    </form>
                                </div>

                                {/* Manage Existing Packages Table */}
                                <div class="glass-card p-6 rounded-2xl border border-slate-800 shadow-xl overflow-x-auto">
                                    <h3 class="text-lg font-bold text-white mb-4">Existing Active Packages ({packages.length})</h3>
                                    <table class="w-full text-left text-xs text-slate-300">
                                        <thead class="bg-slate-900 text-slate-400 font-semibold border-b border-slate-800">
                                            <tr>
                                                <th class="p-3">Package</th>
                                                <th class="p-3">Category / State</th>
                                                <th class="p-3">Price</th>
                                                <th class="p-3">Duration</th>
                                                <th class="p-3 text-right">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-800">
                                            {packages.map((pkg) => (
                                                <tr key={pkg.id} class="hover:bg-slate-800/40">
                                                    <td class="p-3 flex items-center gap-3">
                                                        <img src={pkg.image} class="h-10 w-10 rounded-lg object-cover" onError={(e)=>{ e.target.onerror = null; e.target.src="https://placehold.co/100x100/1e293b/ffffff?text=Trip"; }} />
                                                        <span class="font-bold text-white">{pkg.title}</span>
                                                    </td>
                                                    <td class="p-3">
                                                        <span class="bg-blue-900/60 text-blue-300 px-2 py-0.5 rounded text-[10px] font-semibold mr-1">
                                                            {pkg.category}
                                                        </span>
                                                        <span class="bg-amber-950/60 text-amber-400 px-2 py-0.5 rounded text-[10px]">
                                                            {pkg.state}
                                                        </span>
                                                    </td>
                                                    <td class="p-3 font-extrabold text-emerald-400">₹{pkg.price}</td>
                                                    <td class="p-3">{pkg.duration}</td>
                                                    <td class="p-3 text-right space-x-2">
                                                        <button 
                                                            onClick={() => startEditPackage(pkg)} 
                                                            class="bg-amber-600/80 hover:bg-amber-600 text-white px-2.5 py-1 rounded text-[11px] font-semibold"
                                                        >
                                                            Edit
                                                        </button>
                                                        <button 
                                                            onClick={() => handleDeletePackage(pkg.id)} 
                                                            class="bg-rose-600/80 hover:bg-rose-600 text-white px-2.5 py-1 rounded text-[11px] font-semibold"
                                                        >
                                                            Delete
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {}
                    
                    {/* MODAL 1: BOOKING FORM TO WHATSAPP */}
                    {bookingModalPkg && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                            <div class="glass-modal max-w-lg w-full rounded-3xl p-6 border border-slate-700 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                                <button 
                                    onClick={() => setBookingModalPkg(null)} 
                                    class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 p-2 rounded-full text-xs"
                                >
                                    <i class="fa-solid fa-xmark text-sm"></i>
                                </button>

                                <div class="flex items-center gap-3 mb-4">
                                    <img src={bookingModalPkg.image} class="h-12 w-12 rounded-xl object-cover" />
                                    <div>
                                        <span class="text-[10px] bg-blue-500/20 text-blue-400 font-bold px-2 py-0.5 rounded">
                                            {bookingModalPkg.category}
                                        </span>
                                        <h3 class="font-bold text-white text-base leading-tight">{bookingModalPkg.title}</h3>
                                        <p class="text-xs text-emerald-400 font-extrabold">Price: ₹{bookingModalPkg.price} / person</p>
                                    </div>
                                </div>

                                <form onSubmit={handlePackageBookingSubmit} class="space-y-3.5">
                                    <div>
                                        <label class="text-xs font-semibold text-slate-300 block mb-1">Your Full Name *</label>
                                        <input 
                                            type="text" 
                                            placeholder="e.g. Amit Kumar" 
                                            value={bookingCustomer.name} 
                                            onChange={(e) => setBookingCustomer({...bookingCustomer, name: e.target.value})} 
                                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                                            required
                                        />
                                    </div>

                                    <div>
                                        <label class="text-xs font-semibold text-slate-300 block mb-1">Mobile / WhatsApp Number *</label>
                                        <input 
                                            type="tel" 
                                            placeholder="e.g. 9876543210" 
                                            value={bookingCustomer.phone} 
                                            onChange={(e) => setBookingCustomer({...bookingCustomer, phone: e.target.value})} 
                                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                                            required
                                        />
                                    </div>

                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="text-xs font-semibold text-slate-300 block mb-1">Number of Travelers</label>
                                            <select 
                                                value={bookingCustomer.travelersCount} 
                                                onChange={(e) => setBookingCustomer({...bookingCustomer, travelersCount: e.target.value})} 
                                                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                                            >
                                                <option value="1 Person">1 Person</option>
                                                <option value="2 Adults">2 Adults</option>
                                                <option value="3-5 Group">3-5 Group</option>
                                                <option value="6+ Family Group">6+ Family Group</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label class="text-xs font-semibold text-slate-300 block mb-1">Select Available Date</label>
                                            <select 
                                                value={bookingCustomer.selectedDate} 
                                                onChange={(e) => setBookingCustomer({...bookingCustomer, selectedDate: e.target.value})} 
                                                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                                            >
                                                <option value="">Choose Date...</option>
                                                {Array.isArray(bookingModalPkg.dates) && bookingModalPkg.dates.map((d, i) => (
                                                    <option key={i} value={d}>{d}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label class="text-xs font-semibold text-slate-300 block mb-1">Or Specific Travel Dates (If custom)</label>
                                        <input 
                                            type="text" 
                                            placeholder="e.g. Preferred 15th to 18th Oct" 
                                            value={bookingCustomer.customDates} 
                                            onChange={(e) => setBookingCustomer({...bookingCustomer, customDates: e.target.value})} 
                                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                                        />
                                    </div>

                                    <div>
                                        <label class="text-xs font-semibold text-slate-300 block mb-1">Special Requirements / Notes</label>
                                        <textarea 
                                            rows="2" 
                                            placeholder="Any special requests like meal type, pickup point..." 
                                            value={bookingCustomer.notes} 
                                            onChange={(e) => setBookingCustomer({...bookingCustomer, notes: e.target.value})} 
                                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500"
                                        ></textarea>
                                    </div>

                                    <button 
                                        type="submit" 
                                        class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3 rounded-2xl shadow-xl shadow-emerald-950/60 text-xs transition-all flex items-center justify-center gap-2"
                                    >
                                        <i class="fa-brands fa-whatsapp text-lg"></i>
                                        Send Booking Details via WhatsApp
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL 2: PACKAGE DETAILS MODAL */}
                    {selectedPkgDetail && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                            <div class="glass-modal max-w-xl w-full rounded-3xl overflow-hidden border border-slate-700 shadow-2xl relative max-h-[90vh] flex flex-col">
                                <div class="relative h-56 bg-slate-800">
                                    <img src={selectedPkgDetail.image} class="w-full h-full object-cover" />
                                    <button 
                                        onClick={() => setSelectedPkgDetail(null)} 
                                        class="absolute top-4 right-4 text-slate-300 hover:text-white bg-slate-900/80 p-2 rounded-full text-xs backdrop-blur-md"
                                    >
                                        <i class="fa-solid fa-xmark text-sm"></i>
                                    </button>
                                    <div class="absolute bottom-3 left-3 flex gap-2">
                                        <span class="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full">
                                            {selectedPkgDetail.category}
                                        </span>
                                        <span class="bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1 rounded-full">
                                            📍 {selectedPkgDetail.state}
                                        </span>
                                    </div>
                                </div>

                                <div class="p-6 overflow-y-auto space-y-4">
                                    <h3 class="text-xl font-extrabold text-white">{selectedPkgDetail.title}</h3>
                                    <p class="text-xs text-slate-300 leading-relaxed">{selectedPkgDetail.description}</p>

                                    <div>
                                        <h4 class="text-xs font-bold text-amber-400 mb-2">Trip Highlights & Inclusions:</h4>
                                        <div class="grid grid-cols-2 gap-2">
                                            {Array.isArray(selectedPkgDetail.highlights) ? selectedPkgDetail.highlights.map((h, idx) => (
                                                <div key={idx} class="flex items-center gap-2 text-xs text-slate-300 bg-slate-900/60 p-2 rounded-lg border border-slate-800">
                                                    <i class="fa-solid fa-circle-check text-emerald-400"></i>
                                                    <span>{h}</span>
                                                </div>
                                            )) : (
                                                <p class="text-xs text-slate-400">{selectedPkgDetail.highlights}</p>
                                            )}
                                        </div>
                                    </div>

                                    <div class="flex items-center justify-between border-t border-slate-800 pt-4">
                                        <div>
                                            <span class="text-xs text-slate-400 block">Package Fare</span>
                                            <span class="text-2xl font-black text-emerald-400">₹{selectedPkgDetail.price}</span>
                                        </div>
                                        <button 
                                            onClick={() => { const p = selectedPkgDetail; setSelectedPkgDetail(null); setBookingModalPkg(p); }}
                                            class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition-all shadow-md shadow-blue-900/40"
                                        >
                                            Book This Package
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL 3: ADMIN AUTH MODAL */}
                    {isAdminAuthModalOpen && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
                            <div class="glass-modal max-w-sm w-full rounded-3xl p-6 border border-slate-700 shadow-2xl relative">
                                <button 
                                    onClick={() => { setIsAdminAuthModalOpen(false); setAdminError(''); }} 
                                    class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 p-2 rounded-full text-xs"
                                >
                                    <i class="fa-solid fa-xmark text-sm"></i>
                                </button>

                                <div class="text-center mb-5">
                                    <div class="h-12 w-12 bg-blue-600/20 text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-2 border border-blue-500/30">
                                        <i class="fa-solid fa-lock text-xl"></i>
                                    </div>
                                    <h3 class="text-lg font-bold text-white">Admin Authentication</h3>
                                    <p class="text-xs text-slate-400">Enter security password to access control panel.</p>
                                </div>

                                <form onSubmit={handleAdminLogin} class="space-y-4">
                                    <div>
                                        <input 
                                            type="password" 
                                            placeholder="Enter Admin Password..." 
                                            value={adminPassInput} 
                                            onChange={(e) => setAdminPassInput(e.target.value)} 
                                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500"
                                            required
                                            autoFocus
                                        />
                                    </div>

                                    {adminError && (
                                        <p class="text-xs text-rose-400 font-semibold text-center">{adminError}</p>
                                    )}

                                    <button 
                                        type="submit" 
                                        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-md shadow-blue-900/40"
                                    >
                                        Unlock Admin Panel
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {}
                    <div class="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 backdrop-blur-lg border-t border-slate-800 md:hidden px-6 py-2 flex items-center justify-between">
                        <button 
                            onClick={() => setActiveTab('home')} 
                            class={`flex flex-col items-center gap-1 ${activeTab === 'home' ? 'text-blue-400' : 'text-slate-400'}`}
                        >
                            <i class="fa-solid fa-compass text-base"></i>
                            <span class="text-[10px] font-semibold">Trips</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('tickets')} 
                            class={`flex flex-col items-center gap-1 ${activeTab === 'tickets' ? 'text-blue-400' : 'text-slate-400'}`}
                        >
                            <i class="fa-solid fa-ticket text-base"></i>
                            <span class="text-[10px] font-semibold">Tickets</span>
                        </button>
                        <a 
                            href={`https://wa.me/${WHATSAPP_NUMBER}`} 
                            target="_blank" 
                            rel="noreferrer" 
                            class="flex flex-col items-center gap-1 text-emerald-400"
                        >
                            <i class="fa-brands fa-whatsapp text-lg"></i>
                            <span class="text-[10px] font-semibold">WhatsApp</span>
                        </a>
                        <button 
                            onClick={() => {
                                if (isAdminLoggedIn) setActiveTab('admin');
                                else setIsAdminAuthModalOpen(true);
                            }} 
                            class={`flex flex-col items-center gap-1 ${activeTab === 'admin' ? 'text-blue-400' : 'text-slate-400'}`}
                        >
                            <i class="fa-solid fa-user-gear text-base"></i>
                            <span class="text-[10px] font-semibold">Admin</span>
                        </button>
                    </div>

                    {}
                    <footer class="mt-12 border-t border-slate-800 pt-8 pb-12 text-center text-xs text-slate-500">
                        <div class="max-w-7xl mx-auto px-4 flex flex-col items-center gap-3">
                            <div class="flex items-center gap-2">
                                <img src={LOGO_URL} class="h-6 w-6 rounded-md object-cover" />
                                <span class="font-extrabold text-slate-300">AMIT TRAVELS</span>
                            </div>
                            <p>Train, Flight, Bus Tickets & Customized Tour Packages Across India & Abroad.</p>
                            <p class="text-[11px] text-slate-600">Contact: +91 8521694137 | Bengaluru, Karnataka</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
