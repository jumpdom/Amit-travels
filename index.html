<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amit Travels</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
        }
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen pb-12 text-slate-800">

    <!-- App Header -->
    <header class="bg-slate-900 text-white p-4 sticky top-0 z-40 shadow-md">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="https://i.postimg.cc/fkQ0YK8D/A8BDDCEC-7216-44C5-8125-DC1E6122EC5C.png" alt="Amit Travels Logo" class="w-10 h-10 rounded-full bg-white p-0.5 object-cover border border-slate-700">
                <div>
                    <h1 class="text-lg font-extrabold tracking-wide text-amber-400">Amit Travels</h1>
                    <p class="text-[10px] text-slate-400">Your Trusted Travel Partner</p>
                </div>
            </div>
            <button onclick="openAdminModal()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-200 px-3 py-1.5 rounded-full flex items-center gap-1 transition">
                <i class="fa-solid fa-lock text-amber-400"></i> Admin
            </button>
        </div>
    </header>

    <!-- Main Mobile Container -->
    <main class="max-w-md mx-auto p-4 space-y-5">

        <!-- Banner Card -->
        <div class="bg-gradient-to-r from-blue-700 to-indigo-800 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
            <div class="relative z-10">
                <span class="bg-amber-400 text-slate-900 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">Best Deals</span>
                <h2 class="text-xl font-bold mt-2">Book Train, Flight & Bus Tickets Easily</h2>
                <p class="text-xs text-blue-100 mt-1">Select multiple dates and get WhatsApp confirmation!</p>
            </div>
            <i class="fa-solid fa-plane-departure absolute -right-4 -bottom-4 text-7xl text-white/10 rotate-12"></i>
        </div>

        <!-- Booking Query Section -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-ticket text-blue-600"></i> Ticket Booking Request
            </h3>
            
            <!-- Type Tabs -->
            <div class="grid grid-cols-3 gap-2 mb-4">
                <button onclick="switchTab('Flight')" id="tab-Flight" class="tab-btn bg-blue-600 text-white py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-plane"></i> Flight
                </button>
                <button onclick="switchTab('Train')" id="tab-Train" class="tab-btn bg-slate-100 text-slate-600 py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-train"></i> Train
                </button>
                <button onclick="switchTab('Bus')" id="tab-Bus" class="tab-btn bg-slate-100 text-slate-600 py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-bus"></i> Bus
                </button>
            </div>

            <!-- Booking Form -->
            <form id="ticketForm" onsubmit="handleTicketSubmit(event)" class="space-y-3">
                <input type="hidden" id="serviceType" value="Flight">
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[11px] font-semibold text-slate-500">From</label>
                        <input type="text" id="fromLoc" required placeholder="From City" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50 focus:outline-blue-600">
                    </div>
                    <div>
                        <label class="text-[11px] font-semibold text-slate-500">To</label>
                        <input type="text" id="toLoc" required placeholder="To City" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50 focus:outline-blue-600">
                    </div>
                </div>

                <!-- 3-4 Preferred Dates Option -->
                <div>
                    <label class="text-[11px] font-semibold text-slate-500">Select Preferred Dates (Select up to 4 dates)</label>
                    <div class="grid grid-cols-2 gap-2 mt-1">
                        <input type="date" id="date1" required class="text-xs p-2 border rounded-lg bg-slate-50 text-slate-700">
                        <input type="date" id="date2" class="text-xs p-2 border rounded-lg bg-slate-50 text-slate-700">
                        <input type="date" id="date3" class="text-xs p-2 border rounded-lg bg-slate-50 text-slate-700">
                        <input type="date" id="date4" class="text-xs p-2 border rounded-lg bg-slate-50 text-slate-700">
                    </div>
                </div>

                <div>
                    <label class="text-[11px] font-semibold text-slate-500">Passenger Details</label>
                    <input type="text" id="passengerDetails" required placeholder="Name & Mobile Number" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50 focus:outline-blue-600">
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs shadow flex items-center justify-center gap-2 transition">
                    <i class="fa-brands fa-whatsapp text-lg"></i> Book via WhatsApp
                </button>
            </form>
        </div>

        <!-- Tour Category Filters -->
        <div>
            <h3 class="text-sm font-bold text-slate-800 mb-2">Tour Packages & Treks</h3>
            <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none text-xs">
                <button onclick="filterCategory('all')" class="cat-btn bg-blue-600 text-white px-3.5 py-1.5 rounded-full font-semibold whitespace-nowrap shadow-sm">All</button>
                <button onclick="filterCategory('Bangalore')" class="cat-btn bg-white text-slate-600 border border-slate-200 px-3.5 py-1.5 rounded-full font-semibold whitespace-nowrap">1 Day Banglore</button>
                <button onclick="filterCategory('Honeymoon')" class="cat-btn bg-white text-slate-600 border border-slate-200 px-3.5 py-1.5 rounded-full font-semibold whitespace-nowrap">Honeymoon Package</button>
                <button onclick="filterCategory('International')" class="cat-btn bg-white text-slate-600 border border-slate-200 px-3.5 py-1.5 rounded-full font-semibold whitespace-nowrap">International Trips</button>
                <button onclick="filterCategory('Trek')" class="cat-btn bg-white text-slate-600 border border-slate-200 px-3.5 py-1.5 rounded-full font-semibold whitespace-nowrap">State Treks</button>
            </div>
        </div>

        <!-- Tour Packages Container -->
        <div id="packagesList" class="space-y-4">
            <!-- Dynamically Loaded -->
        </div>

    </main>

    <!-- Admin Authentication Modal -->
    <div id="adminAuthModal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-5 w-full max-w-xs space-y-4 shadow-2xl">
            <div class="text-center">
                <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-2 text-lg">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h3 class="text-base font-bold text-slate-800">Admin Login</h3>
                <p class="text-[11px] text-slate-500">Enter password to access panel</p>
            </div>
            <input type="password" id="adminPasswordInput" placeholder="Enter Admin Password" class="w-full text-xs p-3 border rounded-xl focus:outline-blue-600 bg-slate-50">
            <div class="flex justify-end gap-2">
                <button onclick="closeAdminModal()" class="px-3 py-2 text-xs text-slate-500 font-semibold">Cancel</button>
                <button onclick="verifyAdmin()" class="px-4 py-2 text-xs bg-blue-600 text-white rounded-xl font-bold shadow">Login</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div id="adminPanelModal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl p-5 w-full max-w-md space-y-4 shadow-2xl my-8">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-blue-600"></i> Add New Package
                </h3>
                <button onclick="closeAdminPanel()" class="text-slate-400 text-xl font-bold">&times;</button>
            </div>
            
            <form onsubmit="addNewPackage(event)" class="space-y-3">
                <div>
                    <label class="text-[11px] font-semibold text-slate-600">Package Title</label>
                    <input type="text" id="pkgTitle" required placeholder="e.g. Coorg Hill Station Trek" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[11px] font-semibold text-slate-600">Category</label>
                        <select id="pkgCategory" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50">
                            <option value="Bangalore">1 Day Bangalore</option>
                            <option value="Honeymoon">Honeymoon Package</option>
                            <option value="International">International Trip</option>
                            <option value="Trek">Trip / Trek</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[11px] font-semibold text-slate-600">State / Location Name</label>
                        <input type="text" id="pkgState" placeholder="e.g. Karnataka / Bali" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50">
                    </div>
                </div>
                <div>
                    <label class="text-[11px] font-semibold text-slate-600">Price (₹)</label>
                    <input type="number" id="pkgPrice" required placeholder="2999" class="w-full text-xs p-2.5 border rounded-xl bg-slate-50">
                </div>
                <div>
                    <label class="text-[11px] font-semibold text-slate-600">Photo Link (URL)</label>
                    <input type="url" id="pkgImage" required placeholder="https://i.postimg.cc/..." class="w-full text-xs p-2.5 border rounded-xl bg-slate-50">
                </div>
                <div>
                    <label class="text-[11px] font-semibold text-slate-600">Package Details</label>
                    <textarea id="pkgDetails" rows="3" required placeholder="Details about stay, food, inclusions..." class="w-full text-xs p-2.5 border rounded-xl bg-slate-50"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-3 rounded-xl shadow transition">
                    + Add Tour Package
                </button>
            </form>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const WHATSAPP_NUM = "918521694137";
        const ADMIN_PASS = "Amit855102@";

        let defaultPackages = [
            {
                id: 1,
                title: "1 Day Nandi Hills & Bangalore Sightseeing",
                category: "Bangalore",
                state: "Karnataka",
                price: "1,499",
                image: "https://images.unsplash.com/photo-1596176530529-78163a4f7af2?w=500&q=80",
                details: "Pickup & Drop, Nandi Hills sunrise, Botanical Garden & Temple visit included."
            },
            {
                id: 2,
                title: "Romantic Goa Beach Honeymoon Package",
                category: "Honeymoon",
                state: "Goa",
                price: "12,999",
                image: "https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?w=500&q=80",
                details: "4 Days 3 Nights stay, Resort, Candlelight Dinner, Beach Tours & Cruise."
            },
            {
                id: 3,
                title: "Exotic Bali Island Paradise Tour",
                category: "International",
                state: "Indonesia",
                price: "34,999",
                image: "https://images.unsplash.com/photo-1537996194471-e657df975ab4?w=500&q=80",
                details: "5 Days trip covering Ubud, Waterfalls, Temple tour & Kuta Beach."
            }
        ];

        function getPackages() {
            const stored = localStorage.getItem("amit_travels_pkgs");
            return stored ? JSON.parse(stored) : defaultPackages;
        }

        function renderPackages(filter = "all") {
            const list = document.getElementById("packagesList");
            const packages = getPackages();
            list.innerHTML = "";

            const filtered = packages.filter(pkg => {
                if (filter === "all") return true;
                return pkg.category.toLowerCase() === filter.toLowerCase() || 
                       (pkg.state && pkg.state.toLowerCase().includes(filter.toLowerCase()));
            });

            if (filtered.length === 0) {
                list.innerHTML = `<div class="bg-white p-6 text-center rounded-2xl text-slate-400 text-xs">No packages found for this category.</div>`;
                return;
            }

            filtered.forEach(pkg => {
                list.innerHTML += `
                    <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200 flex flex-col">
                        <div class="relative">
                            <img src="${pkg.image}" alt="${pkg.title}" class="w-full h-44 object-cover" onerror="this.src='https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=500&q=80'">
                            ${pkg.state ? `<span class="absolute top-3 left-3 bg-slate-900/80 text-white backdrop-blur-sm text-[10px] font-semibold px-2.5 py-1 rounded-full"><i class="fa-solid fa-location-dot text-amber-400"></i> ${pkg.state}</span>` : ''}
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-1.5">
                                    <h4 class="font-bold text-sm text-slate-800 leading-snug">${pkg.title}</h4>
                                    <span class="text-xs font-extrabold text-emerald-600 bg-emerald-50 border border-emerald-200 px-2.5 py-0.5 rounded-lg whitespace-nowrap ml-2">₹${pkg.price}</span>
                                </div>
                                <p class="text-[11px] text-slate-500 mb-3 leading-relaxed">${pkg.details}</p>
                            </div>
                            <button onclick="bookPackage('${pkg.title}', '${pkg.price}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow transition">
                                <i class="fa-brands fa-whatsapp text-base"></i> Book Now
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function switchTab(type) {
            document.getElementById('serviceType').value = type;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn bg-slate-100 text-slate-600 py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5";
            });
            document.getElementById(`tab-${type}`).className = "tab-btn bg-blue-600 text-white py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm";
        }

        function handleTicketSubmit(e) {
            e.preventDefault();
            const service = document.getElementById('serviceType').value;
            const from = document.getElementById('fromLoc').value;
            const to = document.getElementById('toLoc').value;
            const details = document.getElementById('passengerDetails').value;
            
            const dates = [
                document.getElementById('date1').value,
                document.getElementById('date2').value,
                document.getElementById('date3').value,
                document.getElementById('date4').value
            ].filter(Boolean).join(" , ");

            const text = `*New Booking Request - Amit Travels*\n\n` +
                         `*Service:* ${service} Ticket\n` +
                         `*From:* ${from}\n` +
                         `*To:* ${to}\n` +
                         `*Preferred Dates:* ${dates}\n` +
                         `*Passenger Info:* ${details}`;

            window.open(`https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(text)}`, '_blank');
        }

        function bookPackage(title, price) {
            const text = `*Tour Package Booking Request - Amit Travels*\n\n` +
                         `*Package:* ${title}\n` +
                         `*Price:* ₹${price}\n\n` +
                         `Mujhe is package ke baare me aur details chahiye.`;
            window.open(`https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(text)}`, '_blank');
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-white text-slate-600 border border-slate-200 px-3.5 py-1.5 rounded-full font-semibold whitespace-nowrap";
            });
            event.target.className = "cat-btn bg-blue-600 text-white px-3.5 py-1.5 rounded-full font-semibold whitespace-nowrap shadow-sm";
            renderPackages(cat);
        }

        // Admin Security Functions
        function openAdminModal() {
            document.getElementById('adminAuthModal').classList.remove('hidden');
        }
        function closeAdminModal() {
            document.getElementById('adminAuthModal').classList.add('hidden');
        }
        function verifyAdmin() {
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === ADMIN_PASS) {
                closeAdminModal();
                document.getElementById('adminPasswordInput').value = '';
                document.getElementById('adminPanelModal').classList.remove('hidden');
            } else {
                alert("Galat Password! Admin Password enter karein.");
            }
        }
        function closeAdminPanel() {
            document.getElementById('adminPanelModal').classList.add('hidden');
        }

        function addNewPackage(e) {
            e.preventDefault();
            const title = document.getElementById('pkgTitle').value;
            const category = document.getElementById('pkgCategory').value;
            const state = document.getElementById('pkgState').value;
            const price = document.getElementById('pkgPrice').value;
            const image = document.getElementById('pkgImage').value;
            const details = document.getElementById('pkgDetails').value;

            const newPkg = {
                id: Date.now(),
                title, category, state, price, image, details
            };

            const pkgs = getPackages();
            pkgs.unshift(newPkg);
            localStorage.setItem("amit_travels_pkgs", JSON.stringify(pkgs));

            closeAdminPanel();
            renderPackages();
            alert("Naya Tour Package successfully add ho gaya hai!");
        }

        // Initializing App
        renderPackages();
    </script>
</body>
</html>
